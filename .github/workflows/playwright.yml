name: Playwright E2E Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Cài Chromium cho Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Khởi chạy ứng dụng
      - name: Start Janus application
        run: |
          chmod +x ./run_dev.sh
          ./run_dev.sh > /tmp/janus.log 2>&1 &

      # 6. Chờ Frontend sẵn sàng
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/janus.log
          exit 1

      # 7. Chạy Playwright
      - name: Run Playwright tests
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_MODERATOR_EMAIL: ${{ secrets.E2E_MODERATOR_EMAIL }}
          E2E_MODERATOR_PASSWORD: ${{ secrets.E2E_MODERATOR_PASSWORD }}
        run: npx playwright test

      # 8. Lưu báo cáo
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # 9. Lưu log khởi chạy nếu có lỗi
      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: janus-logs
          path: /tmp/janus.log